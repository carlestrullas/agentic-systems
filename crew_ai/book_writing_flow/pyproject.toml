[project]
name = "book_writing_flow"
version = "0.1.0"
description = "A multi-crew CrewAI flow that researches a topic and writes a book about it, on Ollama or a hosted LLM"
authors = [{ name = "Carles Trullàs" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]",
    "python-dotenv",
]

[project.scripts]
kickoff = "book_writing_flow.main:kickoff"
run_crew = "book_writing_flow.main:kickoff"
plot = "book_writing_flow.main:plot"
run_with_trigger = "book_writing_flow.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
