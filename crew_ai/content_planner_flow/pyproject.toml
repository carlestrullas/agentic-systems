[project]
name = "content_planner_flow"
version = "0.1.0"
description = "A CrewAI flow that turns a blog post into a Twitter thread or a LinkedIn post, on Ollama or a hosted LLM"
authors = [{ name = "Carles Trullàs" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]",
    "python-dotenv",
    "requests",
]

[project.scripts]
kickoff = "content_planner_flow.main:kickoff"
run_crew = "content_planner_flow.main:kickoff"
plot = "content_planner_flow.main:plot"
run_with_trigger = "content_planner_flow.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
